[general]
; Priorisoi peliprosessin suorituskyky ja I/O
renice=10
ioprio=0
inhibit_screensaver=1

[cpu]
; AMD Ryzen 7 7800X3D: Yksi yhtenäinen CCD (kaikki 8 ydintä 3D V-Cachella),
; joten ydinten parkkeerausta tai erillistä CCD-sidontaa ei tarvita.
park_cores=no
pin_cores=no

[gpu]
; NVIDIA RTX 3070: Asettaa näytönohjaimen PowerMizer-tilan pelin ajaksi
; tilaan "Prefer Maximum Performance" (1), mikä ehkäisee kellotaajuuksien
; notkahtamista kevyemmissä tai CPU-painotteisissa peleissä.
; Palauttaa adaptiivisen tilan (0) automaattisesti pelin sulkeutuessa.
apply_gpu_optimisations=accept-responsibility
gpu_device=0
nv_powermizer_mode=1
