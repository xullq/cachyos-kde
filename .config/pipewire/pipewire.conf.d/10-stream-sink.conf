# ==============================================================================
# 🎮 PipeWire Split Audio / Virtual Stream Sink
# ==============================================================================
# Luo virtuaalisen äänilaitteen "Game & Stream Audio", joka toistaa äänet
# automaattisesti kuulokkeisiin (loopback), mutta eristää Discordin puheluäänet.
#
# Ohjeet: Katso docs/split_audio_guide.md
# ==============================================================================

context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      audio.position = [ FL FR ]
      capture.props = {
        media.class = "Audio/Sink"
        node.name   = "stream_sink"
        node.description = "Game & Stream Audio"
      }
      playback.props = {
        node.name   = "stream_playback"
        node.passive = true
      }
    }
  }
]
